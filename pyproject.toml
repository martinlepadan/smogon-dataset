[project]
name = "smogon-dataset"
version = "0.1.0"
description = "Pipeline ETL des statistiques d'usage Smogon (2014 → aujourd'hui) vers deux datasets Kaggle : Lite et Complete."
authors = [
    { name = "Martin", email = "martin.lepadanc@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "pandera[polars]>=0.34.1",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "rich>=15.0.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
smogon-dataset = "smogon_dataset.cli:app"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "smogon-stats",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
smogon-stats = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "packages/smogon-stats/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "PL", "N"]
ignore = ["PLR2004"]  # nombres magiques : seuils et constantes métier assumés

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
# pandera reads `unique = [...]` from the Config class of a model.
"src/smogon_dataset/validate.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/smogon-stats/tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "network: test qui interroge smogon.com (exclu par défaut : -m 'not network')",
    "slow: test lent (gros fichiers chaos)",
]

[tool.coverage.run]
source = ["smogon_dataset"]
branch = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "packages/smogon-stats/src"]

[[tool.mypy.overrides]]
module = ["kaggle.*", "kagglehub.*", "pyarrow.*"]
ignore_missing_imports = true
