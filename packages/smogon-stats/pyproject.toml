[project]
name = "smogon-stats"
version = "0.1.1"
description = "Load the Smogon usage stats datasets published on Kaggle as polars LazyFrames."
readme = "README.md"
authors = [
    { name = "Martin", email = "martin.lepadanc@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "polars>=1.0.0",
]
keywords = ["pokemon", "smogon", "showdown", "usage-stats", "kaggle", "polars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/martinlepadan/smogon-dataset"
Issues = "https://github.com/martinlepadan/smogon-dataset/issues"
Lite = "https://www.kaggle.com/datasets/martinlepadan/smogon-usage-stats-lite"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
